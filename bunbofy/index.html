<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#02140a">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>bunbofy v3</title>
<style>
*{box-sizing:border-box;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden;font-family:Menlo,monospace}
canvas{display:block;width:100%;height:100%;background:#02140a}
#ui{position:fixed;inset:0;color:#7dff9a;text-shadow:0 0 8px #1cff6a88;pointer-events:none}
#title{position:absolute;top:max(10px,env(safe-area-inset-top));left:0;right:0;text-align:center}
#title h1{margin:0;font-size:22px}#title p{margin:4px 0 0;font-size:12px}
#stats{position:absolute;top:max(54px,calc(env(safe-area-inset-top)+42px));left:12px;font-size:13px;line-height:1.45}
#msg{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);text-align:center;font-size:16px;width:88vw}
#joy{position:fixed;left:18px;bottom:max(20px,env(safe-area-inset-bottom));width:128px;height:128px;border:2px solid #7dff9a;border-radius:50%;pointer-events:auto;opacity:.75;z-index:9}
#knob{position:absolute;width:48px;height:48px;left:40px;top:40px;border-radius:50%;background:#7dff9a66;border:2px solid #7dff9a}
</style></head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="title"><h1>bunbofy</h1><p>ダークインクの逆襲 v3 自動射撃</p></div>
  <div id="stats"></div>
  <div id="msg"></div>
</div>
<div id="joy"><div id="knob"></div></div>
<script>
(()=>{
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const stats=document.getElementById('stats'),msg=document.getElementById('msg');
const joy=document.getElementById('joy'),knob=document.getElementById('knob');
let W=0,H=0;
function resize(){const d=Math.min(3,devicePixelRatio||1);W=canvas.width=innerWidth*d;H=canvas.height=innerHeight*d;canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';}
resize();onresize=resize;
const G='#7dff9a';
const S={mode:'title',score:0,wave:1,p:{x:0,y:70,hp:100,face:1,cd:0},b:[],e:[],sp:[],pt:[],ix:0,iy:0};
function reset(){S.score=0;S.wave=1;S.p={x:0,y:70,hp:100,face:1,cd:0};S.b=[];S.e=[];S.sp=[];S.pt=[];wave(1);}
function wave(n){for(let i=0;i<3+n*2;i++){const a=Math.random()*6.28,d=200+Math.random()*170,t=n>1&&Math.random()<0.28?'ruler':(Math.random()<0.5?'eraser':'clip');
S.e.push({t,x:Math.cos(a)*d,y:Math.sin(a)*d*0.65,hp:t==='ruler'?36+n*8:10+n*3,max:t==='ruler'?36+n*8:10+n*3,r:t==='ruler'?30:16});}}
function nearest(){let best=null,bd=1e12,p=S.p;for(const e of S.e){const d=(e.x-p.x)**2+(e.y-p.y)**2;if(d<bd){bd=d;best=e;}}return best;}
function fire(){
  if(S.mode!=='play')return;
  if(S.p.cd>0)return;
  S.p.cd=0.14;
  const p=S.p; let ang;
  if(Math.hypot(S.ix,S.iy)>0.35) ang=Math.atan2(S.iy,S.ix);
  else {const e=nearest(); ang=e?Math.atan2(e.y-p.y,e.x-p.x):(p.face>0?0:Math.PI);}
  p.face=Math.cos(ang)>=0?1:-1;
  S.b.push({x:p.x+Math.cos(ang)*26,y:p.y+Math.sin(ang)*26,vx:Math.cos(ang)*560,vy:Math.sin(ang)*560,life:1.1});
  boom(p.x+Math.cos(ang)*18,p.y+Math.sin(ang)*18,10,110);
}
function boom(x,y,n,spd){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=spd*(.25+Math.random());S.pt.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.45});}}
function ink(x,y,s){S.sp.push({x,y,s,life:3.5});}
function toS(x,y){const sc=Math.min(W,H)/500;return{x:W/2+x*sc,y:H*0.52+y*sc,sc};}
function start(){if(S.mode!=='play'){reset();S.mode='play';msg.textContent='';}}

// movement joystick only
let jid=null,j0={x:0,y:0};
joy.addEventListener('touchstart',e=>{e.preventDefault();e.stopPropagation();const t=e.changedTouches[0];jid=t.identifier;const r=joy.getBoundingClientRect();j0={x:r.left+r.width/2,y:r.top+r.height/2};moveJ(t.clientX,t.clientY);},{passive:false});
joy.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches){if(t.identifier===jid)moveJ(t.clientX,t.clientY);}},{passive:false});
function endJ(){jid=null;S.ix=S.iy=0;knob.style.left='40px';knob.style.top='40px';}
joy.addEventListener('touchend',endJ);joy.addEventListener('touchcancel',endJ);
function moveJ(x,y){let dx=x-j0.x,dy=y-j0.y;const len=Math.hypot(dx,dy)||1,s=Math.min(1,len/46);dx=dx/len*s;dy=dy/len*s;S.ix=dx;S.iy=dy;knob.style.left=(40+dx*38)+'px';knob.style.top=(40+dy*38)+'px';}

// tap anywhere (except joystick) starts / extra burst
function onTap(e){
  if(e.target===joy||joy.contains(e.target))return;
  start();
  S.p.cd=0;
  fire();
}
addEventListener('touchstart',onTap,{passive:true});
addEventListener('mousedown',onTap);
addEventListener('keydown',e=>{if(e.key===' '||e.key==='z'){start();S.p.cd=0;fire();}});

function glow(w){ctx.lineWidth=w;ctx.strokeStyle=G;ctx.shadowColor='#1cff6a';ctx.shadowBlur=14;}
function drawP(x,y,sc,face){
  ctx.save();ctx.translate(x,y);ctx.scale(sc,sc);glow(2.2);
  ctx.beginPath();ctx.roundRect(-16,-6,32,28,4);ctx.stroke();
  ctx.beginPath();ctx.rect(-10,-16,20,12);ctx.stroke();
  ctx.beginPath();ctx.ellipse(0,4,10,8,0,0,7);ctx.stroke();
  ctx.fillStyle=G;ctx.beginPath();ctx.arc(-6,2,2.3,0,7);ctx.arc(6,2,2.3,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(0,8,5,.2,Math.PI-.2);ctx.stroke();
  ctx.beginPath();ctx.moveTo(-8,22);ctx.lineTo(-10,30);ctx.moveTo(8,22);ctx.lineTo(10,30);ctx.stroke();
  ctx.beginPath();ctx.moveTo(16*face,6);ctx.lineTo(28*face,0);ctx.stroke();
  ctx.restore();
}
function drawE(e,x,y,sc){
  ctx.save();ctx.translate(x,y);ctx.scale(sc,sc);glow(1.8);
  if(e.t==='ruler'){ctx.beginPath();ctx.rect(-36,-10,72,20);ctx.stroke();ctx.fillStyle=G;ctx.beginPath();ctx.arc(-8,-18,2.5,0,7);ctx.arc(8,-18,2.5,0,7);ctx.fill();}
  else if(e.t==='eraser'){ctx.beginPath();ctx.roundRect(-14,-12,28,24,3);ctx.stroke();ctx.fillStyle=G;ctx.beginPath();ctx.arc(-6,-6,2,0,7);ctx.arc(6,-6,2,0,7);ctx.fill();}
  else{ctx.beginPath();ctx.ellipse(0,0,12,8,.4,0,7);ctx.stroke();ctx.fillStyle=G;ctx.beginPath();ctx.arc(-3,-2,1.8,0,7);ctx.arc(5,-1,1.8,0,7);ctx.fill();}
  const w=e.t==='ruler'?50:28;ctx.shadowBlur=0;ctx.strokeStyle='#234';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-w/2,-28);ctx.lineTo(w/2,-28);ctx.stroke();ctx.strokeStyle=G;ctx.beginPath();ctx.moveTo(-w/2,-28);ctx.lineTo(-w/2+w*(e.hp/e.max),-28);ctx.stroke();ctx.restore();
}
let last=performance.now();
function loop(now){
  const dt=Math.min(0.033,(now-last)/1000);last=now;
  if(S.mode==='play'){
    const p=S.p;
    p.x+=S.ix*230*dt;p.y+=S.iy*230*dt;
    p.x=Math.max(-250,Math.min(250,p.x));p.y=Math.max(-170,Math.min(170,p.y));
    if(Math.abs(S.ix)>0.2)p.face=S.ix>0?1:-1;
    p.cd=Math.max(0,p.cd-dt);
    fire(); // auto fire every cd
    for(const b of S.b){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;}S.b=S.b.filter(b=>b.life>0);
    for(const e of S.e){
      const dx=p.x-e.x,dy=p.y-e.y,d=Math.hypot(dx,dy)||1;
      e.x+=dx/d*(e.t==='ruler'?50:78)*dt;e.y+=dy/d*(e.t==='ruler'?50:78)*dt;
      if(d<e.r+18)p.hp-=16*dt;
      for(const b of S.b){if(Math.hypot(b.x-e.x,b.y-e.y)<e.r+12){e.hp-=9;b.life=0;ink(e.x,e.y,14);boom(e.x,e.y,8,150);S.score+=10;}}
    }
    S.e=S.e.filter(e=>{if(e.hp<=0){ink(e.x,e.y,24);boom(e.x,e.y,18,210);S.score+=e.t==='ruler'?80:25;return false;}return true;});
    for(const s of S.sp)s.life-=dt;S.sp=S.sp.filter(s=>s.life>0);
    for(const q of S.pt){q.x+=q.vx*dt;q.y+=q.vy*dt;q.life-=dt;q.vx*=.95;q.vy*=.95;}S.pt=S.pt.filter(q=>q.life>0);
    if(!S.e.length){S.wave++;if(S.wave>6)S.mode='win';else wave(S.wave);}
    if(p.hp<=0){p.hp=0;S.mode='over';}
  }
  ctx.fillStyle='#02140a';ctx.fillRect(0,0,W,H);
  const {sc}=toS(0,0);
  ctx.save();ctx.translate(W/2,H*0.52);ctx.strokeStyle='#0a3a1a';ctx.lineWidth=1;ctx.shadowBlur=0;
  const step=40*sc,n=16;for(let i=-n;i<=n;i++){ctx.beginPath();ctx.moveTo(-n*step,i*step);ctx.lineTo(n*step,i*step);ctx.moveTo(i*step,-n*step);ctx.lineTo(i*step,n*step);ctx.stroke();}ctx.restore();
  for(const s of S.sp){const p=toS(s.x,s.y);ctx.save();ctx.globalAlpha=Math.min(1,s.life);ctx.fillStyle='#1cff6a77';ctx.shadowColor=G;ctx.shadowBlur=18;ctx.beginPath();ctx.ellipse(p.x,p.y,s.s*p.sc*0.09,s.s*p.sc*0.055,0,0,7);ctx.fill();ctx.restore();}
  for(const b of S.b){const p=toS(b.x,b.y);ctx.save();ctx.fillStyle=G;ctx.shadowColor=G;ctx.shadowBlur=20;ctx.beginPath();ctx.arc(p.x,p.y,10,0,7);ctx.fill();ctx.beginPath();ctx.globalAlpha=.45;ctx.ellipse(p.x-b.vx*0.012,p.y-b.vy*0.012,16,7,Math.atan2(b.vy,b.vx),0,7);ctx.fill();ctx.restore();}
  for(const q of S.pt){const p=toS(q.x,q.y);ctx.globalAlpha=Math.max(0,q.life*2);ctx.fillStyle=G;ctx.fillRect(p.x,p.y,3,3);ctx.globalAlpha=1;}
  const list=[...S.e.map(e=>({y:e.y,fn:()=>{const p=toS(e.x,e.y);drawE(e,p.x,p.y,p.sc*1.15);}})),{y:S.p.y,fn:()=>{const p=toS(S.p.x,S.p.y);drawP(p.x,p.y,p.sc*1.4,S.p.face);}}];
  list.sort((a,b)=>a.y-b.y);list.forEach(o=>o.fn());
  stats.innerHTML=S.mode==='play'?('HP '+Math.ceil(S.p.hp)+'<br>WAVE '+S.wave+'/6<br>SCORE '+S.score):'';
  if(S.mode==='title')msg.innerHTML='画面をタップで開始<br>開始したら自動でインクが出る<br>左パッドで移動';
  else if(S.mode==='over')msg.innerHTML='インクが尽きた<br>SCORE '+S.score+'<br>タップで再戦';
  else if(S.mode==='win')msg.innerHTML='撃退！ SCORE '+S.score+'<br>タップでもう一度';
  else msg.innerHTML='';
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body></html>
