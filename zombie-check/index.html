<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>今日のあなたのゾンビ度診断</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%;background:#d5d9e0;color:#1a1a1a;font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif}
body{background-image:radial-gradient(rgba(255,255,255,.28) 1.2px,transparent 1.3px);background-size:28px 28px}
.phone{max-width:430px;margin:0 auto;min-height:100dvh;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 28px)}
.banner{background:#fff;border:3px solid #111;border-radius:8px;padding:10px;text-align:center;box-shadow:4px 4px 0 #111;margin-bottom:12px}
.banner h1{margin:0;font-size:21px;line-height:1.2}.banner em{font-style:normal;color:#3c9a45}.heart{color:#e23b4a}
.tabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:12px}
.tabs button{border:2px solid #111;background:#fff;border-radius:10px;padding:9px 4px;font-weight:900;font-size:13px}
.tabs button.on{background:#1f2a30;color:#fff}.hidden{display:none}
.block-title{text-align:center;font-weight:900;font-size:17px;margin:0 0 6px}
.status{display:grid;grid-template-columns:1fr 1.1fr;gap:8px;margin-bottom:10px}
.box{background:#fff;border:2px solid #111;border-radius:8px;padding:10px}.k{font-size:11px;font-weight:800}
.pct{font-size:36px;font-weight:900;color:#2f9a3a;line-height:1}
.bar{height:10px;background:#e2e6ec;border-radius:99px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#8be46f,#2f9a3a)}
.st{display:flex;gap:6px;align-items:center}.face{font-size:32px}.nm{font-weight:900;font-size:14px}
.hero{background:#fff;border:2px solid #111;border-radius:14px;padding:10px;display:flex;gap:8px;align-items:center;margin-bottom:8px}
.hero .big{font-size:76px;line-height:1}.hero .big.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.hero p{margin:0;font-size:13px;line-height:1.55;font-weight:700}
.mission{background:#fffbe6;border:2px solid #111;border-radius:12px;padding:10px;margin-bottom:10px}
.lucky{background:#eef7ff;border:2px solid #111;border-radius:12px;padding:10px;margin-bottom:10px}
.need{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{border:2px solid #111;border-radius:999px;padding:4px 8px;font-size:12px;font-weight:800;background:#fff}.chip.ok{background:#d9f5c8}
.streak{text-align:center;font-weight:900;font-size:13px;margin:0 0 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.sec{font-size:11px;font-weight:900;margin:10px 0 6px}
.item{background:#fff;border:2px solid #111;border-radius:12px;padding:10px 8px;text-align:center;font-weight:900;font-size:14px}
.item.on{background:#e7f8df}.item.bad.on{background:#fde8e8}.item .emo{display:block;font-size:20px}
.item.luck{outline:3px solid #3b82c4}
.play{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.play button{border:2px solid #111;border-radius:12px;padding:12px 8px;font-weight:900;background:#fff}
.drop{margin-top:6px;text-align:center;font-weight:900;font-size:13px}
.reset,.shareb{width:100%;margin-top:8px;border:2px solid #111;border-radius:10px;padding:12px;font-weight:900;background:#4d5d66;color:#fff}
.shareb{background:#fff;color:#111}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:10px 0 12px}
.day{background:#fff;border:2px solid #111;border-radius:10px;padding:6px 2px;text-align:center}.day.empty{opacity:.4}.day.today{outline:3px solid #2f9a3a}
.day .w,.day .p{font-size:10px;font-weight:900}.day .f{font-size:20px}
.types,.bag{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.type,.loot{border:2px solid #111;border-radius:10px;padding:8px;text-align:center;background:#fff;opacity:.35}
.type.got,.loot.got{opacity:1;background:#f3fff0}.type .f,.loot .f{font-size:32px}.type .n,.loot .n{font-size:11px;font-weight:900}
.book{background:#fff;border:2px solid #111;border-radius:12px;padding:12px;margin-bottom:10px}.book h2{margin:0 0 8px;font-size:14px;text-align:center}
.sum{text-align:center;font-size:13px;font-weight:800;margin-top:8px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(12px);background:#111;color:#fff;padding:10px 14px;border-radius:999px;font-size:13px;opacity:0;transition:.2s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.block-sub{text-align:center;font-size:12px;color:#555;margin:0 0 10px}
</style></head><body>
<div class="phone">
<div class="banner"><h1>今日のあなたの <span class="heart">❤</span><br><em>ゾンビ度診断アプリ</em></h1></div>
<div class="tabs">
<button class="on" id="t1" onclick="showTab('today')">今日</button>
<button id="t2" onclick="showTab('book')">週間図鑑</button>
<button id="t3" onclick="showTab('bag')">ドロップ</button>
</div>
<section id="today">
<div class="block-title">【今日のゾンビ度診断】</div>
<p class="streak" id="streak"></p>
<div class="lucky"><b>今日のラッキーアイテム</b><div class="drop" id="luckyLine"></div></div>
<div class="status">
<div class="box"><div class="k">ゾンビ度：</div><div class="pct" id="pct">80%</div><div class="bar"><i id="bar"></i></div></div>
<div class="box"><div class="k">今日のステータス：</div><div class="st"><div class="face" id="face">🧟</div><div class="nm" id="rankName">ヤッフルゾンビ</div></div></div>
</div>
<div class="hero"><div class="big" id="heroFace">🧟</div><p id="advice"></p></div>
<div class="mission"><b>今日の生存ミッション</b><div class="need" id="need"></div><div class="drop" id="dropLine">3つ押すとドロップ</div></div>
<div class="sec">回復</div><div class="grid" id="good"></div>
<div class="sec">ゾンビ</div><div class="grid" id="bad"></div>
<div class="play"><button onclick="groan()">アーンする</button><button onclick="shuffleWalk()">シャッフル歩き</button></div>
<button class="reset" onclick="resetToday()">今日をリセット</button>
<button class="shareb" onclick="share()">Share</button>
</section>
<section id="book" class="hidden">
<div class="block-title">【週間図鑑】</div>
<div class="week" id="week"></div>
<div class="book"><h2>【詳細コンプリート】</h2><div class="types" id="types"></div><p class="sum" id="sum"></p></div>
<button class="shareb" onclick="shareWeek()">週間をシェア</button>
</section>
<section id="bag" class="hidden">
<div class="block-title">【拾ったもの図鑑】</div>
<p class="block-sub">ミッション達成で1日1個</p>
<div class="book"><div class="bag" id="loots"></div><p class="sum" id="lootSum"></p></div>
</section>
</div>
<div class="toast" id="toast"></div>
<script>
const BASE=80;
const GOOD=[{id:"water",emo:"💧",label:"水飲んだ",d:-12},{id:"walk",emo:"🚶",label:"歩いた",d:-14},{id:"sun",emo:"☀️",label:"日光浴びた",d:-10},{id:"sugar",emo:"🍬",label:"糖分とった",d:-12},{id:"nap",emo:"😴",label:"仮眠した",d:-16},{id:"talk",emo:"💬",label:"人と話した",d:-8}];
const BAD=[{id:"snooze",emo:"⏰",label:"スヌーズした",d:10},{id:"phone",emo:"📱",label:"画面見すぎ",d:8},{id:"shuffle",emo:"🦶",label:"足を引きずった",d:9},{id:"groan",emo:"😩",label:"アーンと出た",d:11}];
const RANKS=[{id:"human",min:0,name:"生存者",face:"🙂",cls:"human",advice:"意識も足取りも人間側。"},{id:"half",min:25,name:"半覚醒生存者",face:"😌",cls:"human",advice:"まだ目が細い。"},{id:"yaffle",min:45,name:"ヤッフルゾンビ",face:"🧟",cls:"zombie",advice:"意識はあるが動きが鈍い。糖分補給を。"},{id:"runner",min:70,name:"走るゾンビ",face:"🏃",cls:"zombie",advice:"足は動くが方向が怪しい。"},{id:"stand",min:88,name:"スタンディングゾンビ",face:"😵",cls:"zombie",advice:"その場シャッフル。"}];
const LOOT=[{id:"brain",emo:"🧠",name:"ちょっと古い脳"},{id:"shoe",emo:"👟",name:"片方の靴"},{id:"toast",emo:"🍞",name:"冷めたトースト"},{id:"can",emo:"🥫",name:"謎の缶詰"},{id:"light",emo:"🔦",name:"生存者のライト"},{id:"tooth",emo:"🦷",name:"抜けた前歯"}];
const LUCKY=[{emo:"💧",name:"常温の水",tip:"飲むと足が少し戻る",bonus:"water"},{emo:"🍞",name:"冷めたトースト",tip:"糖分が効きやすい",bonus:"sugar"},{emo:"🔦",name:"生存者のライト",tip:"日光で安定する",bonus:"sun"},{emo:"👟",name:"片方の靴",tip:"歩いた記録がよく通る",bonus:"walk"},{emo:"🥫",name:"謎の缶詰",tip:"仮眠と相性がいい",bonus:"nap"},{emo:"🧠",name:"ちょっと古い脳",tip:"人と話すと人間側へ",bonus:"talk"}];
function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function todayKey(){return ymd(new Date())}
function rankFor(p){let r=RANKS[0];RANKS.forEach(x=>{if(p>=x.min)r=x});return r}
function load(){try{return JSON.parse(localStorage.getItem("zombiePlay")||"{}")}catch(e){return {}}}
function save(){try{localStorage.setItem("zombiePlay",JSON.stringify(state))}catch(e){}}
function hash(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h)}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1500)}
function luckyToday(){return LUCKY[hash(todayKey()+"lucky")%LUCKY.length]}
let state=load(); if(!state.days)state.days={}; if(!state.bag)state.bag={};
if(!state.days[todayKey()])state.days[todayKey()]={on:{},p:BASE};
let day=state.days[todayKey()]; let on=day.on||{};
const missionIds=(function(){const pool=GOOD.map(x=>x.id);const h=hash(todayKey());return [pool[h%6],pool[(h+2)%6],pool[(h+4)%6]].filter((v,i,a)=>a.indexOf(v)===i).concat(pool).filter((v,i,a)=>a.indexOf(v)===i).slice(0,3)})();
function scoreOf(map){let p=BASE;GOOD.concat(BAD).forEach(it=>{if(map[it.id])p+=it.d}); if(map[luckyToday().bonus]) p-=8; return Math.max(3,Math.min(99,p))}
function persist(){const p=scoreOf(on),r=rankFor(p);state.days[todayKey()]={on:on,p:p,name:r.name,face:r.face,id:r.id,cls:r.cls,missionDone:!!day.missionDone,drop:day.drop||null};day=state.days[todayKey()];save()}
function streakCount(){let n=0;const d=new Date();for(let i=0;i<21;i++){const rec=state.days[ymd(d)];if(rec&&rec.name)n++;else if(i>0)break;d.setDate(d.getDate()-1)}return n}
function missionDone(){return missionIds.every(id=>on[id])}
function maybeDrop(){if(day.drop||!missionDone())return;const item=LOOT[hash(todayKey()+"drop")%LOOT.length];day.drop=item.id;state.bag[item.id]=(state.bag[item.id]||0)+1;day.missionDone=true;persist();toast("ドロップ！ "+item.emo+" "+item.name)}
function showTab(id){["today","book","bag"].forEach(s=>document.getElementById(s).classList.toggle("hidden",s!==id));document.getElementById("t1").classList.toggle("on",id==="today");document.getElementById("t2").classList.toggle("on",id==="book");document.getElementById("t3").classList.toggle("on",id==="bag");if(id==="book")renderBook();if(id==="bag")renderBag()}
function btns(el,list,bad){const lk=luckyToday().bonus;el.innerHTML=list.map(it=>'<button class="item '+(bad?"bad ":"")+(on[it.id]?"on":"")+(it.id===lk?" luck":"")+'" onclick="toggle(\''+it.id+'\')"><span class="emo">'+it.emo+"</span>"+it.label+"</button>").join("")}
function renderToday(){const p=scoreOf(on),r=rankFor(p);document.getElementById("pct").textContent=p+"%";document.getElementById("bar").style.width=p+"%";document.getElementById("rankName").textContent=r.name;document.getElementById("face").textContent=r.face;document.getElementById("heroFace").textContent=r.face;document.getElementById("advice").textContent=r.advice;document.getElementById("streak").textContent="生存記録 "+streakCount()+"日";const lk=luckyToday();const hit=!!on[lk.bonus];document.getElementById("luckyLine").textContent=lk.emo+" "+lk.name+(hit?" 【発動中】 ":" ")+lk.tip;const all=GOOD.concat(BAD);document.getElementById("need").innerHTML=missionIds.map(id=>{const it=all.find(x=>x.id===id);return '<span class="chip '+(on[id]?"ok":"")+'">'+(it?it.emo+it.label:id)+"</span>"}).join("");const drop=LOOT.find(x=>x.id===day.drop);document.getElementById("dropLine").textContent=drop?("今日のドロップ "+drop.emo+" "+drop.name):"3つ押すとドロップ";btns(document.getElementById("good"),GOOD,false);btns(document.getElementById("bad"),BAD,true);persist()}
function last7(){const arr=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);arr.push({d:d,rec:state.days[ymd(d)],today:i===0})}return arr}
function renderBook(){const days=last7(),wd=["日","月","火","水","木","金","土"];document.getElementById("week").innerHTML=days.map(x=>{if(!x.rec||!x.rec.name)return '<div class="day empty'+(x.today?" today":"")+'"><div class="w">'+wd[x.d.getDay()]+'</div><div class="f">·</div><div class="p">-</div></div>';return '<div class="day'+(x.today?" today":"")+'"><div class="w">'+wd[x.d.getDay()]+'</div><div class="f">'+x.rec.face+'</div><div class="p">'+x.rec.p+'%</div></div>'}).join("");const got={};days.forEach(x=>{if(x.rec&&x.rec.id)got[x.rec.id]=true});document.getElementById("types").innerHTML=RANKS.map(r=>{const n=days.filter(x=>x.rec&&x.rec.id===r.id).length;return '<div class="type '+(got[r.id]?"got":"")+'"><div class="f">'+r.face+'</div><div class="n">'+r.name+'</div><div class="c">'+(got[r.id]?n+"日":"未確認")+"</div></div>"}).join("");const filled=days.filter(x=>x.rec&&x.rec.name).length;const avg=filled?Math.round(days.reduce((s,x)=>s+(x.rec&&x.rec.p||0),0)/filled):0;document.getElementById("sum").textContent=filled+"日 / 平均"+avg+"%"}
function renderBag(){document.getElementById("loots").innerHTML=LOOT.map(x=>{const n=state.bag[x.id]||0;return '<div class="loot '+(n?"got":"")+'"><div class="f">'+x.emo+'</div><div class="n">'+x.name+'</div><div class="c">'+(n?n+"個":"未入手")+"</div></div>"}).join("");document.getElementById("lootSum").textContent="入手 "+Object.keys(state.bag).length+" / "+LOOT.length}
function toggle(id){on[id]=!on[id];persist();if(on[id]&&missionDone())maybeDrop();renderToday();const it=GOOD.concat(BAD).find(x=>x.id===id);const lk=luckyToday();toast(it.id===lk.bonus&&on[id]?("ラッキー発動！ "+lk.name):(on[id]?"記録：":"取消：")+it.label)}
function resetToday(){on={};day.drop=null;day.missionDone=false;persist();renderToday();toast("今日をリセット")}
function groan(){const el=document.getElementById("heroFace");el.classList.remove("shake");void el.offsetWidth;el.classList.add("shake");on.groan=true;persist();renderToday();toast("アーン……")}
function shuffleWalk(){on.shuffle=true;on.walk=true;persist();if(missionDone())maybeDrop();renderToday();toast("シャッフル歩き")}
async function share(){const p=scoreOf(on),r=rankFor(p),lk=luckyToday();const text="今日のゾンビ度 "+p+"%（"+r.name+"）\nラッキー："+lk.emo+lk.name;if(navigator.share){try{await navigator.share({title:"ゾンビ度診断",text});return}catch(e){}}if(navigator.clipboard)navigator.clipboard.writeText(text).then(()=>toast("コピーした"))}
async function shareWeek(){const days=last7();const line=days.map(x=>{const wd=["日","月","火","水","木","金","土"][x.d.getDay()];return wd+(x.rec&&x.rec.face?x.rec.face+x.rec.p+"%":"·")}).join(" ");if(navigator.share){try{await navigator.share({title:"週間図鑑",text:"週間ゾンビ図鑑\n"+line});return}catch(e){}}}
renderToday();
</script></body></html>
